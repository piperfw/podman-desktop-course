<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproducible Research Cambridge</title>
  <style>
    :root {
      --teal: #00aebf;       /* RRCam logo, bright letter */
      --deep-teal: #166571;  /* RRCam logo, dark letter   */
      --ink: #0d2b30;        /* text on --teal            */
      --paper: #f5f5f5;      /* text on --deep-teal       */
      --gutter: clamp(1.5rem, 8vw, 7rem);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }
    body {
      background: var(--deep-teal);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .stage {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;   /* touch drags move the split instead of scrolling */
      user-select: none;
    }

    .pane { position: absolute; top: 0; bottom: 0; left: 0; }

    .pane--base   { right: 0; background: var(--deep-teal); color: var(--paper); }

    .pane--reveal { width: 50%; overflow: hidden; background: var(--teal); color: var(--ink); }

    .pane__inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 var(--gutter);
    }

    /* Logo mark: R followed by a mirrored R */
    .logo {
      --overlap: 0.1em;
      position: absolute;
      top: clamp(1.5rem, 5vh, 3rem);
      left: var(--gutter);
      display: flex;
      font-weight: 800;
      font-size: clamp(2.75rem, 6vw, 4.5rem);
      line-height: 1;
    }
    .logo__r:first-child { position: relative; z-index: 1; }   /* left letter on top */
    .logo__r--mirror { margin-left: calc(-1 * var(--overlap)); transform: scaleX(-1); }

    .pane--base   .logo { color: var(--teal); }
    .pane--reveal .logo { color: var(--deep-teal); }

    .content { max-width: 44rem; }

    h1 {
      margin: 0 0 1.5rem;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      max-width: 34rem;
      font-size: clamp(1.05rem, 1.6vw, 1.35rem);
      line-height: 1.5;
    }

    p.hint {
      margin-top: 3rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="pane pane--base">
      <div class="pane__inner">
        <div class="logo" role="img" aria-label="Reproducible Research Cambridge">
          <span class="logo__r">R</span><span class="logo__r logo__r--mirror">R</span>
        </div>
        <div class="content">
          <h1>Your first container is running.</h1>
          <p>This page is served from inside a container on your own machine.</p>
          <p class="hint">Move your pointer across the page.</p>
        </div>
      </div>
    </main>

    <div class="pane pane--reveal" id="left-side" aria-hidden="true">
      <div class="pane__inner"></div>
    </div>
  </div>

  <script>
    const left = document.getElementById("left-side");
    const source = document.querySelector(".pane--base .pane__inner");

    left.querySelector(".pane__inner").innerHTML = source.innerHTML;

    const setSplit = clientX => {
      const pct = Math.min(100, Math.max(0, clientX / window.innerWidth * 100));
      left.style.width = `${pct}%`;
    };

    window.addEventListener("pointermove", e => setSplit(e.clientX));
    window.addEventListener("pointerdown", e => setSplit(e.clientX));
  </script>
</body>
</html>
